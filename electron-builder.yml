appId: com.osumeta.app
productName: Osu Meta
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
win:
  executableName: OsuMeta
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: OsuMeta-${version}-setup.${ext}
  shortcutName: Osu Meta
  uninstallDisplayName: Osu Meta
  createDesktopShortcut: always
portable:
  artifactName: OsuMeta-${version}-portable.${ext}
npmRebuild: false
publish: null
