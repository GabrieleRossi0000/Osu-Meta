appId: com.osumeta.app
productName: Osu Meta
copyright: Copyright © leledorf
directories:
  buildResources: build
extraResources:
  - from: src/main/scripts
    to: scripts
    filter:
      - '**/*'
  - from: build/icon.ico
    to: app-icon.ico
  - from: build/icon.png
    to: app-icon.png
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
win:
  executableName: OsuMeta
  publisherName: leledorf
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: OsuMeta-${version}-setup.${ext}
  shortcutName: Osu Meta
  uninstallDisplayName: Osu Meta
  createDesktopShortcut: always
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  runAfterFinish: true
npmRebuild: false
